/**:
  ros__parameters:
    # --- mission / trajectory -------------------------------------------
    'goal_tolerance': 0.2
    'max_speed': 1.0
    'max_acceleration': 2.0
    'sattle_extra': 20.0

    # Overridden by the launch file against dji_captain's installed share dir -
    # these relative paths only resolve from the source tree.
    'continuous_model_path': 'vehicles/hardware/dji/dji_captain/models/M350/continuous_model/model_bla_diag_cmdvle.npz'
    'discrete_model_path': 'vehicles/hardware/dji/dji_captain/models/M350/discrete_model/discrete_models.yaml'

    # --- LQG trim during the mission ------------------------------------
    # False = fly the ZVD feedforward open loop (the A/B baseline).
    'enable_lqg': True
    # rho enters the gain as ~sqrt(rho), so it must move by decades to matter.
    # At rho=1 the trim saturated max_trim_speed and the loop limit-cycled.
    'lqg_rho': 10.0
    'lqg_theta_max': 0.3
    'lqg_position_max': 0.3
    # Older than this and the swing estimate is unusable -> feedforward only.
    'max_estimate_age': 0.5
    # Caps the TRIM alone, not just the total command. A trim sitting on its cap
    # is bang-bang, not the linear law it was designed as.
    'max_trim_speed': 0.5
    # Beyond this the linearised model (sin th ~ th) is invalid -> drop feedback.
    'max_theta_for_lqg': 0.35

    # --- payload stabilisation before departing --------------------------
    # Needed because estimate_length_and_damping EXCITES a swing, and ZVD can
    # only avoid creating new swing - it cannot cancel existing swing.
    'stabilize_before_mission': True
    'stabilize_theta_tol': 0.02
    'stabilize_omega_tol': 0.05
    'stabilize_settle_time': 1.0
    'stabilize_timeout': 45.0
    # Its own control penalty: stabilising needs more authority than trimming,
    # because here the command IS the whole control action.
    'stabilize_rho': 2.0
    'stabilize_theta_max': 0.3
    'stabilize_position_max': 2.0
